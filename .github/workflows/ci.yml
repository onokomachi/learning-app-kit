name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      # dist/ はコミット済み（tarball 配布で prepare が走らないため）。
      # src と食いちがったまま公開されないよう、再ビルドして差分が出たら落とす。
      - name: dist/ が src と一致しているか
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ が src と食いちがっています。npm run build してコミットしてください"
            git --no-pager diff --stat dist
            exit 1
          fi
          echo "✅ dist/ は最新です"
